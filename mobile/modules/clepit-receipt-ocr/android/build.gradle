plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}
group = 'expo.modules.clepitocr'
version = '0.2.0'
android {
  namespace 'expo.modules.clepitocr'
  defaultConfig { minSdkVersion 24; versionCode 2; versionName '0.2.0' }
}
dependencies {
  implementation 'com.google.mlkit:text-recognition:16.0.1'
  // Versión incluida en la app: lee el timbre del SII sin descargar nada.
  implementation 'com.google.mlkit:barcode-scanning:17.3.0'
}
