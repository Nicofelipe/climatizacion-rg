plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}
group = 'expo.modules.clepitocr'
version = '0.1.0'
android {
  namespace 'expo.modules.clepitocr'
  defaultConfig { minSdkVersion 24; versionCode 1; versionName '0.1.0' }
}
dependencies { implementation 'com.google.mlkit:text-recognition:16.0.1' }
